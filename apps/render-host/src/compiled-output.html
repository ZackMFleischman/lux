<!doctype html>
<!-- lux-relay-worker-liveness-v2: forwards worker counters with owner identity. -->
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:; style-src 'unsafe-inline'; connect-src 'none'">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{width:100%;height:100%;display:block}</style>
<canvas width="1920" height="1080"></canvas>
<script type="module">
let worker, identity, sequence = 0;
const pending = new Map();
function request(message, transfer = []) {
  const requestId = crypto.randomUUID();
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => { pending.delete(requestId); reject(Error('Visual worker response deadline')); }, 5000);
    pending.set(requestId, {resolve,reject,timer});
    worker.postMessage({...message,requestId}, transfer);
  });
}
window.startVisual = async (release, values, externallyDriven = false, initProbeId) => {
  if (worker) throw Error('Visual already initialized');
  worker = new Worker('./compiled-worker.js', {type:'module'});
  identity = {instanceId:crypto.randomUUID(),generation:1,revisionId:release.sourceHash};
  let probeReady=false,probeSent=false;
  if(typeof initProbeId==='string'&&/^[a-f0-9]{32}$/.test(initProbeId))window.goInitProbe=(attempt,revision)=>{
    if (!probeReady || probeSent || attempt!==initProbeId || revision!==identity.revisionId) return false;
    probeSent=true;worker.postMessage({type:'init-probe-go',...identity,initProbeId});return true;
  };
  worker.onmessage = ({data}) => {
    if(data.type==='init-probe-ready'&&typeof initProbeId==='string'&&data.initProbeId===initProbeId&&data.instanceId===identity.instanceId&&data.generation===identity.generation&&data.revisionId===identity.revisionId&&!probeReady){
      probeReady=true;console.log(JSON.stringify({kind:'init-probe-ready',attemptId:initProbeId,revisionId:identity.revisionId}));return;
    }
    if (data.type === 'heartbeat' && data.instanceId===identity.instanceId && data.generation===identity.generation && data.revisionId===identity.revisionId) console.log(JSON.stringify({kind:'runtime-heartbeat',frameId:data.frameId,workerHeartbeat:data.workerHeartbeat}));
    if (data.type === 'failure') console.error(JSON.stringify({kind:'failure',reason:data.message}));
    if (data.type === 'ready' || data.type === 'status') console.log(JSON.stringify({kind:'runtime-frame',...data}));
    const wait = pending.get(data.requestId);
    if (wait) {
      clearTimeout(wait.timer); pending.delete(data.requestId);
      data.type === 'failure' ? wait.reject(Error(data.message)) : wait.resolve(data);
    }
  };
  worker.onerror = event => console.error(JSON.stringify({kind:'failure',reason:event.message}));
  const previousCanvas = document.querySelector('canvas');
  // A placeholder that has already been composited can stay blank when later
  // transferred in Electron OSR. Attach a fresh surface at host initialization.
  const freshCanvas = previousCanvas.cloneNode();
  previousCanvas.replaceWith(freshCanvas);
  const canvas = freshCanvas.transferControlToOffscreen();
  const generic=release.linked.linkedVersion===3;
  identity.controlSchemaHash=generic?release.linked.controlSchemaHash:undefined;
  return request({type:'init',...identity,linked:release.linked,settings:release.settings,
    sdkVersion:generic?'0.2.0':'0.1.0',controlSchema:generic?release.linked.controls:undefined,
    canvas,controls:generic?values:{intensity:values},playing:true,externallyDriven,...(initProbeId===undefined?{}:{initProbeId})},[canvas]);
};
window.drawVisual = () => request({type:'frame',...identity});
window.setIntensity = value => request({type:'controls',...identity,controlSequence:++sequence,values:{intensity:value}});
window.setParameters = values => request({type:'controls',...identity,controlSequence:++sequence,values});
window.captureVisual = async () => {
  const result = await request({type:'capture',...identity});
  if(result.type !== 'capture') throw Error(result.message || 'Capture failed');
  return {metadata:result.metadata,bytes:Array.from(new Uint8Array(result.bytes))};
};
</script>
