<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lux Copilot</title>
<style>
  :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #101116; color: #e9eaf0; }
  body { margin: 0; padding: 40px 20px; } main { max-width: 660px; margin: auto; }
  h1 { margin-bottom: 4px; } p { color: #b9bdca; } .controls { display: flex; gap: 12px; margin: 24px 0; }
  button { font: inherit; border: 1px solid #797f96; border-radius: 8px; padding: 12px 18px; cursor: pointer; background: #303650; color: white; }
  button:disabled { opacity: .45; cursor: default; } button:focus-visible { outline: 3px solid #b0b8ff; outline-offset: 3px; }
  #status { font-weight: 600; } pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #191c25; border: 1px solid #333848; border-radius: 10px; padding: 16px; min-height: 150px; max-height: 420px; overflow: auto; font: 14px/1.6 ui-monospace, monospace; }
  audio { width: 100%; margin-bottom: 16px; } small { color: #b9bdca; }
</style>
<main><h1>Lux Copilot</h1><p>Talk naturally while you work in Lux.</p>
<div id="status" role="status">Ready</div>
<div class="controls"><button id="start">Start listening</button><button id="stop" disabled>Stop listening</button></div>
<audio id="speaker" autoplay controls aria-label="Copilot audio output"></audio>
<small>Voice uses your API key. Lux tasks use your local Codex ChatGPT login.<br>Allow microphone access when your browser asks. Stop ends the paid voice session.</small>
<pre id="log" role="log" aria-label="Conversation and activity"></pre></main>
<script type="module" src="/client.js"></script></html>
